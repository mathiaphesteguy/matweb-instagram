<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa de publicaciones</title>
<style>
  body { font-family: system-ui, sans-serif; background: #e9e9ec; margin: 0; padding: 24px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .row { display: flex; gap: 16px; }
  .cell { width: 324px; height: 405px; overflow: hidden; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.15); background: #fff; }
  .cell iframe { width: 1080px; height: 1350px; border: 0; transform: scale(.3); transform-origin: 0 0; }
</style>
</head>
<body>
<script>
  // Muestra los 3 slides de cada publicación de posts.json (usa los mismos parámetros que generate.mjs)
  fetch('../posts.json').then(r => r.json()).then(cfg => {
    const only = new URLSearchParams(location.search).get('only');
    cfg.sites.forEach((s, i) => {
      if (only && !s.slug.startsWith(only)) return;
      const h = document.createElement('h2');
      h.textContent = s.slug;
      const row = document.createElement('div');
      row.className = 'row';
      for (const slide of [1, 2, 3]) {
        const q = new URLSearchParams({ site: s.slug, slide, name: s.name, tag: s.tag, n: String(i + 1).padStart(2, '0'), handle: cfg.handle, bg: s.bg, ink: s.ink, accent: s.accent, font: s.font || '', fw: s.fw || '700', layout: i % 2 ? 'b' : 'a' });
        row.insertAdjacentHTML('beforeend', `<div class="cell"><iframe src="mockup.html?${q}"></iframe></div>`);
      }
      document.body.append(h, row);
    });
  });
</script>
</body>
</html>
